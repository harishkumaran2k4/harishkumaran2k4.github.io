baseURL: "https://harishkumaran2k4.github.io/"
title: Harish Kumaran
pagination:
  pagerSize: 5

theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Harish Kumaran
  description: "My own public space"
  keywords: [Personal, Website, Blog, Harish Kumaran]
  author: Me
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "prfl.png"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  label:
    text: " "
    icon: prfl.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Harish Kumaran
    subtitle: "Hi👋 Welcome to my World"
    imageUrl: "prfl.png"
    imageWidth: 200
    imageHeight: 200
    imageTitle: my image
    buttons:


  # home-info mode
  #homeInfoParams:
  #  Title: "Posts"
  #  Content: Arranged alphabetically

  socialIcons:
   - name: reddit
     url: "https://www.reddit.com/user/harish-kumaran/"
   - name: x
     url: "https://x.com/_HarishKumaran_"
   - name: stackoverflow
     url: "https://stackoverflow.com"
   - name: github
     url: "https://github.com/harishkumaran2k4"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/<path_to_repo>/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: About
      name: About
      url: /about.md
      weight: 10
    - identifier: Awards
      name: Awards
      url: /awards.html
      weight: 20
    - identifier: Experience
      name: History
      url: /history.html
      weight: 30
    - identifier: Skills
      name: Skills
      url: /skills.html
      weight: 40
    - identifier: Search
      name: Search
      url: /search
      weight: 50
    - identifier: Blogs
      name: Blogs
      url: /blogs/
      weight: 60
    - identifier: Projects
      name: Projects
      url: /projects
      weight: 70
    - identifier: Contact
      name: Contact
      url: /contact.html
      weight: 80 


# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai